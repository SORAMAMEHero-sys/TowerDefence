<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>本格タワーディフェンス</title>
    <style>
        body { text-align: center; background-color: #222; color: white; font-family: sans-serif; }
        canvas { background-color: #333; border: 2px solid #fff; cursor: crosshair; }
        .menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 10px auto; max-width: 600px; }
        button { padding: 10px; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🛡️ 防衛戦 🛡️</h1>
    <div id="info">金: <span id="money">150</span> | ライフ: <span id="life">5</span></div>
    <div class="menu" id="menu"></div>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const path = [{x:0,y:100},{x:200,y:100},{x:200,y:300},{x:400,y:300},{x:400,y:100},{x:600,y:100}];
        
        let money = 150, life = 5, towers = [];
        const types = [
            { name: "マシンガン", cost: 40, color: "cyan" },
            { name: "スナイパー", cost: 80, color: "orange" },
            { name: "アイス", cost: 60, color: "blue" },
            { name: "ボム", cost: 100, color: "red" }
        ];

        // メニュー生成
        const menu = document.getElementById('menu');
        types.forEach((t, i) => {
            let btn = document.createElement('button');
            btn.textContent = `${t.name}(${t.cost}G)`;
            btn.onclick = () => selected = i;
            menu.appendChild(btn);
        });

        let selected = 0;

        function draw() {
            ctx.clearRect(0, 0, 600, 400);
            // 通路描画
            ctx.strokeStyle = '#555'; ctx.lineWidth = 40;
            ctx.beginPath(); ctx.moveTo(path[0].x, path[0].y);
            path.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.stroke();

            // タワー描画
            towers.forEach(t => {
                ctx.fillStyle = types[t.type].color;
                ctx.beginPath(); ctx.arc(t.x, t.y, 15, 0, Math.PI*2); ctx.fill();
            });
            requestAnimationFrame(draw);
        }

        canvas.onclick = (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left, y = e.clientY - rect.top;
            
            // 通路（幅40）の上に置かせない判定
            for(let i=0; i<path.length-1; i++){
                let p1 = path[i], p2 = path[i+1];
                let dist = Math.abs((p2.y-p1.y)*x - (p2.x-p1.x)*y + p2.x*p1.y - p2.y*p1.x) / Math.sqrt((p2.y-p1.y)**2 + (p2.x-p1.x)**2);
                if(dist < 30) { alert("道には置けないよ！"); return; }
            }

            if(money >= types[selected].cost) {
                towers.push({x, y, type: selected});
                money -= types[selected].cost;
                document.getElementById('money').textContent = money;
            }
        };

        draw();
    </script>
</body>
</html>
