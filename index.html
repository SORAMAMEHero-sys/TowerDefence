<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>本格タワーディフェンス</title>
    <style>
        body {
            text-align: center;
            background-color: #222;
            color: white;
            font-family: sans-serif;
            margin: 10px;
        }
        canvas {
            background-color: #333;
            border: 2px solid #fff;
            cursor: pointer;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .info {
            font-size: 15px;
            margin-bottom: 5px;
        }
        .menu, .controls {
            margin: 8px 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px;
        }
        button {
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            background-color: #444;
            color: white;
            border: 1px solid #777;
            border-radius: 4px;
            margin: 2px;
        }
        button.selected {
            background-color: #00bcd4;
            color: black;
            font-weight: bold;
        }
        button.sell-mode {
            background-color: #ff5722;
            color: white;
        }
        #saveMsg {
            color: lightgreen;
            font-size: 12px;
            height: 15px;
            margin-bottom: 5px;
        }
        /* ショップ画面のスタイル */
        #shopModal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #222;
            border: 3px solid #00bcd4;
            padding: 20px;
            z-index: 100;
            width: 90%;
            max-width: 400px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #shopModal h2 {
            margin-top: 0;
            color: #00bcd4;
        }
        .shop-item {
            background: #333;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            text-align: left;
            font-size: 14px;
        }
        .shop-item button {
            float: right;
            background-color: #4caf50;
            margin-top: -3px;
        }
        #shopOpenBtn {
            background-color: #9c27b0;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 20px;
            margin: 10px auto;
            display: block;
            width: 80%;
            max-width: 300px;
        }
    </style>
    <link rel="manifest" href="./manifest.json">
</head>
<body>

    <h1>🛡️ タワーディフェンス改 🛡️</h1>
    <div class="info">
        所持金: <span id="money">150</span>G | 
        ライフ: <span id="life">5</span> | 
        BP: <span id="bp">0</span>BP<br>
        タワー数: <span id="towerCount">0</span>/<span id="maxTowerLimit">30</span> | 
        経過時間: <span id="timer">0</span>秒
    </div>
    <div id="saveMsg"></div>

    <!-- タワー選択メニュー（6種類 ＋ 売却モード） -->
    <div class="menu">
        <button id="btn-0" onclick="selectTower(0)" class="selected">マシンガン (40G)</button>
        <button id="btn-1" onclick="selectTower(1)">スナイパー (80G)</button>
        <button id="btn-2" onclick="selectTower(2)">アイス (60G)</button>
        <button id="btn-3" onclick="selectTower(3)">フリーズ (200G)</button>
        <button id="btn-4" onclick="selectTower(4)">高級MG (500G)</button>
        <button id="btn-5" onclick="selectTower(5)">高級狙撃 (800G)</button>
        <button id="btn-sell" onclick="selectSellMode()" class="sell-mode">🗑️ タワーを売る</button>
    </div>

    <!-- 一時停止ボタンなど -->
    <div class="controls">
        <button id="pauseBtn" onclick="togglePause()">⏸️ 一時停止</button>
        <button onclick="resetGameDataCompletely()" style="background-color: #722;">🔄 セーブ初期化</button>
    </div>

    <!-- ご要望の赤い丸の位置に配置したショップボタン -->
    <button id="shopOpenBtn" onclick="toggleShop(true)">🛒 ショップを開く</button>

    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <!-- ショップモーダル画面 -->
    <div id="shopModal">
        <h2>🛒 BPショップ</h2>
        <p>保有BP: <span id="shopBp">0</span> BP</p>
        
        <div class="shop-item">
            <strong>設置上限アップ</strong> (<span id="limitLevel">0</span>/20)<br>
            上限が1増えます（最大50個）<br>
            <span style="color:gold;">5 BP</span> <button onclick="buyUpgrade('limit')">購入</button>
        </div>

        <div class="shop-item">
            <strong>ボス特効ダメージ</strong> (<span id="bossDmgLevel">0</span>/10)<br>
            ボスへのダメージ ×1.25倍<br>
            <span style="color:gold;">10 BP</span> <button onclick="buyUpgrade('bossDmg')">購入</button>
        </div>

        <div class="shop-item">
            <strong>破壊光線解放</strong> (<span id="rayStatus">未解放</span>)<br>
            3000G・30秒ごとに3000ダメ<br>
            <span style="color:gold;">30 BP</span> <button id="rayBtn" onclick="buyUpgrade('ray')">購入</button>
        </div>

        <button onclick="toggleShop(false)" style="background-color: #777; width: 100%; margin-top: 10px;">閉じる（ゲーム再開）</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ゲーム内データの読み込み（通常データ）
        let money = localStorage.getItem('td_money') ? parseInt(localStorage.getItem('td_money')) : 150;
        let life = localStorage.getItem('td_life') ? parseInt(localStorage.getItem('td_life')) : 5;
        let gameSeconds = localStorage.getItem('td_seconds') ? parseInt(localStorage.getItem('td_seconds')) : 0;
        
        // 永続データ（ゲームオーバーでも消えないBPとショップ購入要素）
        let bp = localStorage.getItem('td_bp') ? parseInt(localStorage.getItem('td_bp')) : 0;
        let upgradeLimitCount = localStorage.getItem('td_up_limit') ? parseInt(localStorage.getItem('td_up_limit')) : 0;
        let upgradeBossDmgCount = localStorage.getItem('td_up_bossDmg') ? parseInt(localStorage.getItem('td_up_bossDmg')) : 0;
        let hasDestructionRay = localStorage.getItem('td_up_ray') === 'true';

        let towers = [];
        let savedTowers = localStorage.getItem('td_towers');
        if (savedTowers) {
            try { towers = JSON.parse(savedTowers); } catch(e) { towers = []; }
        }

        let isPaused = false;
        let isShopOpen = false;
        let selectedTowerType = 0; 
        let isSellMode = false;

        // 破壊光線用タイマー（30秒ごと）
        let rayTimer = 0;
        let rayEffectTimer = 0; // 光線エフェクト用

        // タワー種類の定義
        const towerTypes = [
            { name: "マシンガン", cost: 40, range: 70, damage: 8, cooldownMax: 15, color: "cyan" },
            { name: "スナイパー", cost: 80, range: 150, damage: 45, cooldownMax: 60, color: "orange" },
            { name: "アイス", cost: 60, range: 80, damage: 5, cooldownMax: 30, color: "blue", slow: true },
            { name: "フリーズ", cost: 200, range: 100, damage: 0, cooldownMax: 90, color: "white", freeze: true },
            { name: "高級MG", cost: 500, range: 100, damage: 20, cooldownMax: 5, color: "lime" },
            { name: "高級狙撃", cost: 800, range: 250, damage: 150, cooldownMax: 80, color: "gold" }
        ];

        const path = [
            {x: 0, y: 100},
            {x: 200, y: 100},
            {x: 200, y: 300},
            {x: 400, y: 300},
            {x: 400, y: 100},
            {x: 600, y: 100}
        ];

        let enemies = [];
        let spawnTimer = 0;
        let waveLevel = 0;

        // 上限計算（基本30 ＋ アップグレード数、最大50）
        function getMaxTowerLimit() {
            return Math.min(50, 30 + upgradeLimitCount);
        }

        // ボス特効倍率計算 (1.25のn乗)
        function getBossDamageMultiplier() {
            return Math.pow(1.25, upgradeBossDmgCount);
        }

        class Enemy {
            constructor(isBoss = false, level = 0) {
                this.x = path[0].x;
                this.y = path[0].y;
                this.pathIndex = 0;
                this.isBoss = isBoss;
                this.level = level;

                let scale = Math.pow(1.5, level);

                if (isBoss) {
                    this.speed = 1.0;
                    this.hp = Math.floor((120 + (level * 100)) * scale);
                    this.reward = Math.floor(150 * scale);
                    this.maxHp = this.hp;
                    this.radius = 18;
                } else {
                    this.speed = 1.2;
                    this.hp = Math.floor(35 * scale);
                    this.reward = Math.floor(20 * scale);
                    this.maxHp = this.hp;
                    this.radius = 10;
                }
                this.originalSpeed = this.speed;
                this.slowTimer = 0;
                this.freezeTimer = 0;
            }

            update() {
                if (this.freezeTimer > 0) {
                    this.freezeTimer--;
                    return false;
                }

                if (this.slowTimer > 0) {
                    this.speed = this.originalSpeed * 0.5;
                    this.slowTimer--;
                } else {
                    this.speed = this.originalSpeed;
                }

                let target = path[this.pathIndex + 1];
                if (!target) return;

                let dx = target.x - this.x;
                let dy = target.y - this.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < this.speed) {
                    this.x = target.x;
                    this.y = target.y;
                    this.pathIndex++;
                    if (this.pathIndex >= path.length - 1) {
                        life--;
                        updateUI();
                        return true;
                    }
                } else {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }
                return false;
            }

            draw() {
                ctx.fillStyle = this.isBoss ? 'purple' : 'red';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                if (this.freezeTimer > 0) {
                    ctx.strokeStyle = 'cyan';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                } else if (this.isBoss) {
                    ctx.strokeStyle = 'gold';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                ctx.fillStyle = 'black';
                ctx.fillRect(this.x - 15, this.y - (this.radius + 8), 30, 4);
                ctx.fillStyle = this.isBoss ? 'magenta' : 'lime';
                ctx.fillRect(this.x - 15, this.y - (this.radius + 8), 30 * Math.max(0, this.hp / this.maxHp), 4);
            }
        }

        function updateAndDrawTowers() {
            for (let tower of towers) {
                if (tower.cooldown > 0) tower.cooldown--;

                let type = towerTypes[tower.typeIndex];

                let target = null;
                for (let enemy of enemies) {
                    let dist = Math.sqrt((enemy.x - tower.x)**2 + (enemy.y - tower.y)**2);
                    if (dist < type.range && enemy.freezeTimer === 0) {
                        target = enemy;
                        break;
                    }
                }

                if (!target) {
                    for (let enemy of enemies) {
                        let dist = Math.sqrt((enemy.x - tower.x)**2 + (enemy.y - tower.y)**2);
                        if (dist < type.range) {
                            target = enemy;
                            break;
                        }
                    }
                }

                if (target && tower.cooldown === 0) {
                    let finalDmg = type.damage;
                    if (target.isBoss) {
                        finalDmg *= getBossDamageMultiplier();
                    }

                    target.hp -= finalDmg;
                    if (type.slow) target.slowTimer = 90;
                    if (type.freeze) target.freezeTimer = 60;
                    tower.cooldown = type.cooldownMax;

                    ctx.strokeStyle = type.color;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(tower.x, tower.y);
                    ctx.lineTo(target.x, target.y);
                    ctx.stroke();
                }

                ctx.fillStyle = type.color;
                ctx.beginPath();
                ctx.arc(tower.x, tower.y, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }

        function toggleShop(open) {
            isShopOpen = open;
            isPaused = open;
            document.getElementById('shopModal').style.display = open ? 'block' : 'none';
            document.getElementById('pauseBtn').textContent = isPaused ? "▶️ 再開" : "⏸️ 一時停止";
            updateUI();
        }

        function buyUpgrade(type) {
            if (type === 'limit') {
                if (upgradeLimitCount >= 20) { alert("上限に達しています！"); return; }
                if (bp >= 5) {
                    bp -= 5;
                    upgradeLimitCount++;
                    localStorage.setItem('td_bp', bp);
                    localStorage.setItem('td_up_limit', upgradeLimitCount);
                } else { alert("BPが足りません！"); }
            } else if (type === 'bossDmg') {
                if (upgradeBossDmgCount >= 10) { alert("上限に達しています！"); return; }
                if (bp >= 10) {
                    bp -= 10;
                    upgradeBossDmgCount++;
                    localStorage.setItem('td_bp', bp);
                    localStorage.setItem('td_up_bossDmg', upgradeBossDmgCount);
                } else { alert("BPが足りません！"); }
            } else if (type === 'ray') {
                if (hasDestructionRay) { alert("すでに解放済みです！"); return; }
                if (bp >= 30) {
                    bp -= 30;
                    hasDestructionRay = true;
                    localStorage.setItem('td_bp', bp);
                    localStorage.setItem('td_up_ray', true);
                } else { alert("BPが足りません！"); }
            }
            updateUI();
        }

        function selectTower(index) {
            isSellMode = false;
            selectedTowerType = index;
            for (let i = 0; i < towerTypes.length; i++) {
                const btn = document.getElementById(`btn-${i}`);
                if (btn) btn.classList.remove('selected');
            }
            document.getElementById(`btn-sell`).classList.remove('selected');
            const targetBtn = document.getElementById(`btn-${index}`);
            if (targetBtn) targetBtn.classList.add('selected');
        }

        function selectSellMode() {
            isSellMode = true;
            for (let i = 0; i < towerTypes.length; i++) {
                const btn = document.getElementById(`btn-${i}`);
                if (btn) btn.classList.remove('selected');
            }
            document.getElementById(`btn-sell`).classList.add('selected');
        }

        function togglePause() {
            if (isShopOpen) return;
            isPaused = !isPaused;
            document.getElementById('pauseBtn').textContent = isPaused ? "▶️ 再開" : "⏸️ 一時停止";
        }

        function resetGameDataCompletely() {
            if (confirm("【警告】BPやショップ購入品も含めて完全に初期化しますか？")) {
                localStorage.clear();
                location.reload();
            }
        }

        // ゲームオーバー時のリセット（BPは維持、他はお金150・ライフ5・タワー空にしてセーブをクリア）
        function resetGame() {
            money = 150;
            life = 5;
            gameSeconds = 0;
            enemies = [];
            towers = [];
            waveLevel = 0;
            rayTimer = 0;
            
            // プレイ中のセーブデータだけ削除してBPは残す
            localStorage.removeItem('td_money');
            localStorage.removeItem('td_life');
            localStorage.removeItem('td_seconds');
            localStorage.removeItem('td_towers');
            
            updateUI();
        }

        function updateUI() {
            document.getElementById('money').textContent = money;
            document.getElementById('life').textContent = life;
            document.getElementById('timer').textContent = gameSeconds;
            document.getElementById('towerCount').textContent = towers.length;
            document.getElementById('maxTowerLimit').textContent = getMaxTowerLimit();
            document.getElementById('bp').textContent = bp;
            document.getElementById('shopBp').textContent = bp;

            document.getElementById('limitLevel').textContent = upgradeLimitCount;
            document.getElementById('bossDmgLevel').textContent = upgradeBossDmgCount;
            if (hasDestructionRay) {
                document.getElementById('rayStatus').textContent = "解放済";
                document.getElementById('rayBtn').disabled = true;
                document.getElementById('rayBtn').style.backgroundColor = '#555';
            }
        }

        canvas.addEventListener('click', (e) => {
            if (isPaused || isShopOpen || life <= 0) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (isSellMode) {
                let clickedIndex = -1;
                for (let i = 0; i < towers.length; i++) {
                    let dist = Math.sqrt((towers[i].x - x)**2 + (towers[i].y - y)**2);
                    if (dist < 20) {
                        clickedIndex = i;
                        break;
                    }
                }

                if (clickedIndex !== -1) {
                    let targetTower = towers[clickedIndex];
                    let refund = Math.floor(towerTypes[targetTower.typeIndex].cost / 2);
                    
                    if (confirm(`このタワーを売却しますか？\n( ${refund}G が戻ってきます)`)) {
                        money += refund;
                        towers.splice(clickedIndex, 1);
                        updateUI();
                        saveGameData();
                    }
                }
            } else {
                if (towers.length >= getMaxTowerLimit()) {
                    alert(`タワーの上限（${getMaxTowerLimit()}個）に達しています！`);
                    return;
                }

                let cost = towerTypes[selectedTowerType].cost;
                if (money >= cost) {
                    towers.push({ x: x, y: y, typeIndex: selectedTowerType, cooldown: 0 });
                    money -= cost;
                    updateUI();
                    saveGameData();
                } else {
                    alert("お金が足りないよ！");
                }
            }
        });

        function saveGameData() {
            localStorage.setItem('td_money', money);
            localStorage.setItem('td_life', life);
            localStorage.setItem('td_seconds', gameSeconds);
            localStorage.setItem('td_towers', JSON.stringify(towers));
            localStorage.setItem('td_bp', bp);
            
            const msg = document.getElementById('saveMsg');
            msg.textContent = "💾 オートセーブしました";
            setTimeout(() => { msg.textContent = ""; }, 1000);
        }

        setInterval(() => {
            if (!isPaused && !isShopOpen && life > 0) {
                gameSeconds++;
                
                if (hasDestructionRay) {
                    rayTimer++;
                    if (rayTimer >= 30) {
                        rayTimer = 0;
                        if (money >= 3000) {
                            money -= 3000;
                            rayEffectTimer = 20;
                            for (let enemy of enemies) {
                                enemy.hp -= 3000;
                            }
                        }
                    }
                }

                updateUI();

                if (gameSeconds % 20 === 0) {
                    waveLevel++;
                    enemies.push(new Enemy(true, waveLevel));
                }

                saveGameData();
            }
        }, 1000);

        function gameLoop() {
            if (!isPaused && !isShopOpen && life > 0) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = '#555';
                ctx.lineWidth = 30;
                ctx.beginPath();
                ctx.moveTo(path[0].x, path[0].y);
                for (let i = 1; i < path.length; i++) {
                    ctx.lineTo(path[i].x, path[i].y);
                }
                ctx.stroke();

                if (rayEffectTimer > 0) {
                    rayEffectTimer--;
                    ctx.strokeStyle = 'magenta';
                    ctx.lineWidth = 8;
                    ctx.strokeRect(5, 5, canvas.width - 10, canvas.height - 10);
                }

                spawnTimer++;
                let spawnInterval = Math.max(30, 80 - (waveLevel * 5));
                if (spawnTimer > spawnInterval) {
                    enemies.push(new Enemy(false, waveLevel));
                    spawnTimer = 0;
                }

                for (let i = enemies.length - 1; i >= 0; i--) {
                    let reachedGoal = enemies[i].update();
                    if (reachedGoal || enemies[i].hp <= 0) {
                        if (enemies[i].hp <= 0) {
                            money += enemies[i].reward;
                            if (enemies[i].isBoss) {
                                bp++;
                                saveGameData();
                            }
                            updateUI();
                        }
                        enemies.splice(i, 1);
                    } else {
                        enemies[i].draw();
                    }
                }

                updateAndDrawTowers();
            }

            if (life <= 0) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '26px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = '16px sans-serif';
                ctx.fillText("クリックしてゲームをリセット", canvas.width / 2, canvas.height / 2 + 20);
                
                canvas.onclick = () => {
                    resetGame();
                    // ページリロードせず、そのままゲーム画面を再開させる
                    canvas.onclick = null; // クリックイベントを元に戻す
                };
            }

            requestAnimationFrame(gameLoop);
        }

        updateUI();
        gameLoop();
    </script>

</body>
</html>
