<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>本格タワーディフェンス</title>
    <style>
        body { text-align: center; background-color: #222; color: white; font-family: sans-serif; }
        canvas { background-color: #333; border: 2px solid #fff; cursor: crosshair; display: block; margin: 10px auto; }
        .menu { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; max-width: 600px; margin: 0 auto; }
        button { padding: 8px; cursor: pointer; background: #444; color: white; border: 1px solid #777; }
        .selected { background: #00bcd4; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🛡️ 防衛戦 🛡️</h1>
    <div>金:<span id="money">150</span> | ライフ:<span id="life">5</span> | 塔:<span id="count">0</span>/30 | フリーズ:<span id="freezeCount">0</span>/2</div>
    <div class="menu" id="menu"></div>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const path = [{x:0,y:100},{x:200,y:100},{x:200,y:300},{x:400,y:300},{x:400,y:100},{x:600,y:100}];
        
        let money = 150, life = 5, towers = [], enemies = [], bullets = [], selected = 0;
        
        const types = [
            { name: "MG", cost: 40, dmg: 8, range: 70, cd: 15, color: "cyan", type: "normal" },
            { name: "狙撃", cost: 80, dmg: 45, range: 150, cd: 60, color: "orange", type: "normal" },
            { name: "氷", cost: 60, dmg: 2, range: 80, cd: 30, color: "blue", type: "slow" },
            { name: "爆弾", cost: 100, dmg: 30, range: 90, cd: 50, color: "red", type: "normal" },
            { name: "フリーズ", cost: 200, range: 100, color: "white", type: "freeze" },
            { name: "高級", cost: 3000, dmg: 20, range: 100, cd: 5, color: "gold", type: "normal" }
        ];

        // 設置制限チェック用ヘルパー
        const getFreezeCount = () => towers.filter(t => types[t.type].type === "freeze").length;

        const menu = document.getElementById('menu');
        types.forEach((t, i) => {
            let b = document.createElement('button');
            b.textContent = t.name;
            if(i === 0) b.classList.add('selected');
            b.onclick = () => { selected = i; document.querySelectorAll('button').forEach(btn => btn.classList.remove('selected')); b.classList.add('selected'); };
            menu.appendChild(b);
        });

        function update() {
            // 敵生成
            if(Math.random() < 0.02) enemies.push({x:0, y:100, pathIdx:0, hp: 30, maxHp: 30, speed: 1.5, baseSpeed: 1.5, slowTimer: 0});

            // フリーズタワーの特殊ロジック: 1秒(60フレーム)ごとに0.2秒(12フレーム)止める
            const frame = Date.now() % 1000;
            const isFreezeActive = frame < 200; // 0~200msの間だけフリーズON

            towers.forEach(t => {
                let type = types[t.type];
                if(type.type === "freeze") {
                    if(isFreezeActive) {
                        enemies.forEach(en => {
                            if(Math.hypot(en.x-t.x, en.y-t.y) < type.range) en.speed = 0;
                        });
                    }
                } else {
                    if(t.cd > 0) t.cd--;
                    else {
                        for(let en of enemies) {
                            if(Math.hypot(en.x-t.x, en.y-t.y) < type.range) {
                                bullets.push({x: t.x, y: t.y, tx: en.x, ty: en.y});
                                en.hp -= type.dmg;
                                if(type.type === "slow") en.slowTimer = 60;
                                t.cd = type.cd; break;
                            }
                        }
                    }
                }
            });

            // 敵移動処理
            enemies.forEach(en => {
                if(en.speed !== 0) en.speed = (en.slowTimer > 0) ? en.baseSpeed * 0.5 : en.baseSpeed;
                if(en.slowTimer > 0) en.slowTimer--;
                
                let p = path[en.pathIdx + 1];
                let dx = p.x - en.x, dy = p.y - en.y, dist = Math.sqrt(dx*dx+dy*dy);
                if(dist < en.speed) {
                    en.pathIdx++;
                    if(en.pathIdx >= path.length-1) { life--; en.hp = 0; document.getElementById('life').textContent = life; }
                } else { en.x += (dx/dist)*en.speed; en.y += (dy/dist)*en.speed; }
            });
            enemies = enemies.filter(en => en.hp > 0);
        }

        function draw() {
            ctx.clearRect(0,0,600,400);
            ctx.strokeStyle = '#555'; ctx.lineWidth = 40;
            ctx.beginPath(); ctx.moveTo(path[0].x, path[0].y);
            path.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
            
            enemies.forEach(en => { ctx.fillStyle = 'red'; ctx.beginPath(); ctx.arc(en.x, en.y, 8, 0, Math.PI*2); ctx.fill(); });
            towers.forEach(t => { ctx.fillStyle = types[t.type].color; ctx.beginPath(); ctx.arc(t.x, t.y, 12, 0, Math.PI*2); ctx.fill(); });
            update();
            requestAnimationFrame(draw);
        }

        canvas.onclick = (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left, y = e.clientY - rect.top;
            
            // 設置制限チェック
            if(types[selected].type === "freeze" && getFreezeCount() >= 2) {
                alert("フリーズは2つまでしか置けません！"); return;
            }
            
            if(money >= types[selected].cost && towers.length < 30) {
                towers.push({x, y, type: selected, cd: 0});
                money -= types[selected].cost;
                document.getElementById('money').textContent = money;
                document.getElementById('count').textContent = towers.length;
                document.getElementById('freezeCount').textContent = getFreezeCount();
            }
        };
        draw();
    </script>
</body>
</html>
