<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>本格タワーディフェンス</title>
    <style>
        body { text-align: center; background-color: #222; color: white; font-family: sans-serif; }
        canvas { background-color: #333; border: 2px solid #fff; cursor: crosshair; display: block; margin: 10px auto; }
        .menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; max-width: 600px; margin: 0 auto; }
        button { padding: 8px; cursor: pointer; background: #444; color: white; border: 1px solid #777; }
        .selected { background: #00bcd4; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🛡️ 防衛戦 🛡️</h1>
    <div>金:<span id="money">150</span> | 命:<span id="life">5</span> | タワー:<span id="count">0</span>/30 | 時間:<span id="timer">0</span>秒</div>
    <div class="menu" id="menu"></div>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const path = [{x:0,y:100},{x:200,y:100},{x:200,y:300},{x:400,y:300},{x:400,y:100},{x:600,y:100}];
        
        let money = 150, life = 5, towers = [], enemies = [], gameSeconds = 0, selected = 0;
        const types = [
            { name: "マシンガン", cost: 40, damage: 8, range: 70, color: "cyan" },
            { name: "スナイパー", cost: 80, damage: 45, range: 150, color: "orange" },
            { name: "アイス", cost: 60, damage: 5, range: 80, color: "blue" },
            { name: "ボム", cost: 100, damage: 30, range: 90, color: "red" },
            { name: "フリーズ", cost: 200, damage: 0, range: 100, color: "white" },
            { name: "高級MG", cost: 3000, damage: 8, range: 80, color: "cyan" },
            { name: "高級Sniper", cost: 3000, damage: 250, range: 200, color: "gold" }
        ];

        // メニュー生成
        const menu = document.getElementById('menu');
        types.forEach((t, i) => {
            let b = document.createElement('button');
            b.textContent = t.name;
            b.onclick = () => { selected = i; document.querySelectorAll('button').forEach(btn => btn.classList.remove('selected')); b.classList.add('selected'); };
            menu.appendChild(b);
        });

        // 敵クラス
        class Enemy {
            constructor(isBoss) {
                this.x = 0; this.y = 100; this.pathIdx = 0;
                this.hp = isBoss ? 600 : 30;
                this.speed = isBoss ? 0.8 : 1.5;
                this.isBoss = isBoss;
            }
            update() {
                let p = path[this.pathIdx + 1];
                if (!p) return true;
                let dx = p.x - this.x, dy = p.y - this.y, dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < this.speed) this.pathIdx++;
                else { this.x += (dx/dist)*this.speed; this.y += (dy/dist)*this.speed; }
                return false;
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, 600, 400);
            // 道
            ctx.strokeStyle = '#555'; ctx.lineWidth = 40;
            ctx.beginPath(); ctx.moveTo(path[0].x, path[0].y);
            path.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
            
            // 敵生成・移動
            if (Math.random() < 0.02) enemies.push(new Enemy(Math.random() < 0.05));
            enemies.forEach((en, i) => {
                if (en.update()) { life--; enemies.splice(i, 1); }
                ctx.fillStyle = en.isBoss ? 'purple' : 'red';
                ctx.beginPath(); ctx.arc(en.x, en.y, 10, 0, Math.PI*2); ctx.fill();
            });

            // タワー
            towers.forEach(t => {
                ctx.fillStyle = types[t.type].color;
                ctx.beginPath(); ctx.arc(t.x, t.y, 15, 0, Math.PI*2); ctx.fill();
            });
            requestAnimationFrame(gameLoop);
        }

        canvas.onclick = (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left, y = e.clientY - rect.top;
            if(money >= types[selected].cost) {
                towers.push({x, y, type: selected});
                money -= types[selected].cost;
                document.getElementById('money').textContent = money;
            }
        };

        setInterval(() => { gameSeconds++; document.getElementById('timer').textContent = gameSeconds; }, 1000);
        gameLoop();
    </script>
</body>
</html>
