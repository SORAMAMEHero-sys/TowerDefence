<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>シンプル・タワーディフェンス</title>
    <style>
        body {
            text-align: center;
            background-color: #222;
            color: white;
            font-family: sans-serif;
            margin-top: 20px;
        }
        canvas {
            background-color: #333;
            border: 2px solid #fff;
            cursor: pointer;
        }
        .info {
            font-size: 18px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>🛡️ 簡易タワーディフェンス 🛡️</h1>
    <div class="info">
        所持金: <span id="money">100</span>G | 
        ライフ: <span id="life">5</span>
    </div>
    <p>画面をクリックして、敵の道（グレーの道）の近くにタワー（青い丸）を置こう！</p>

    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let money = 100;
        let life = 5;

        // 敵が進む道（折れ線）
        const path = [
            {x: 0, y: 100},
            {x: 200, y: 100},
            {x: 200, y: 300},
            {x: 400, y: 300},
            {x: 400, y: 100},
            {x: 600, y: 100}
        ];

        let enemies = [];
        let towers = [];
        let spawnTimer = 0;

        // 敵クラス
        class Enemy {
            constructor() {
                this.x = path[0].x;
                this.y = path[0].y;
                this.pathIndex = 0;
                this.speed = 1.5;
                this.hp = 30;
                this.maxHp = 30;
            }
            update() {
                let target = path[this.pathIndex + 1];
                if (!target) return;

                let dx = target.x - this.x;
                let dy = target.y - this.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < this.speed) {
                    this.x = target.x;
                    this.y = target.y;
                    this.pathIndex++;
                    if (this.pathIndex >= path.length - 1) {
                        life--;
                        document.getElementById('life').textContent = life;
                        return true; // ゴールしたら消す
                    }
                } else {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }
                return false;
            }
            draw() {
                // 敵の本体
                ctx.fillStyle = 'red';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 10, 0, Math.PI * 2);
                ctx.fill();

                // 体力バー
                ctx.fillStyle = 'black';
                ctx.fillRect(this.x - 12, this.y - 18, 24, 4);
                ctx.fillStyle = 'lime';
                ctx.fillRect(this.x - 12, this.y - 18, 24 * (this.hp / this.maxHp), 4);
            }
        }

        // タワークラス
        class Tower {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.range = 80;
                this.cooldown = 0;
            }
            update() {
                if (this.cooldown > 0) this.cooldown--;

                // 範囲内の敵を攻撃
                for (let enemy of enemies) {
                    let dist = Math.sqrt((enemy.x - this.x)**2 + (enemy.y - this.y)**2);
                    if (dist < this.range && this.cooldown === 0) {
                        enemy.hp -= 15;
                        this.cooldown = 30; // 攻撃の間隔

                        // 弾の軌跡を描く
                        ctx.strokeStyle = 'yellow';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(this.x, this.y);
                        ctx.lineTo(enemy.x, enemy.y);
                        ctx.stroke();
                        break;
                    }
                }
            }
            draw() {
                ctx.fillStyle = 'cyan';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 15, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // クリックしてタワーを置く
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (money >= 50) {
                towers.push(new Tower(x, y));
                money -= 50;
                document.getElementById('money').textContent = money;
            } else {
                alert("お金が足りないよ！（50G必要）");
            }
        });

        // メインゲームループ
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 道を描画
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 30;
            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.stroke();

            // 敵の出現管理
            spawnTimer++;
            if (spawnTimer > 60 && life > 0) {
                enemies.push(new Enemy());
                spawnTimer = 0;
            }

            // 敵の更新と描画
            for (let i = enemies.length - 1; i >= 0; i--) {
                let reachedGoal = enemies[i].update();
                if (reachedGoal || enemies[i].hp <= 0) {
                    if (enemies[i].hp <= 0) {
                        money += 20; // 倒したら報酬
                        document.getElementById('money').textContent = money;
                    }
                    enemies.splice(i, 1);
                } else {
                    enemies[i].draw();
                }
            }

            // タワーの更新と描画
            for (let tower of towers) {
                tower.update();
                tower.draw();
            }

            if (life <= 0) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '30px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
                return;
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>

</body>
</html>
